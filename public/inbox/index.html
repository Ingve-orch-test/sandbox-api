<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox</title>
  <link rel="stylesheet" href="/inbox/inbox.css">
</head>
<body>
  <main class="inbox">
    <header class="inbox-header">
      <h1>Inbox</h1>
      <span id="unread-count" class="unread-count" hidden></span>
      <button id="mark-all-read" class="mark-all-read" type="button" hidden>Mark all as read</button>
    </header>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search messages" aria-label="Search messages">
      <button id="view-inbox" class="view-btn active" type="button" aria-pressed="true">Inbox</button>
      <button id="view-archive" class="view-btn" type="button" aria-pressed="false">Archive</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <ul id="list" class="list"></ul>
  </main>
  <script src="/inbox/unread.js"></script>
  <script src="/inbox/inbox.js"></script>
</body>
</html>
